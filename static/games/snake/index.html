<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="/games/shared.css">
  <style>
    .board { width: min(100%, 420px, calc(100dvh - 180px)); min-width: min(100%, 230px); margin: auto; display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; padding: 6px; border-radius: 14px; background: #334155; }
    .cell { aspect-ratio: 1; border-radius: 3px; background: #1e293b; }
    .cell.snake { background: #34d399; }
    .cell.head { background: #10b981; }
    .cell.food { background: #fb7185; border-radius: 50%; }
    .controls { display: grid; grid-template-columns: repeat(3, 44px); gap: 5px; justify-content: center; }
    .controls [data-dir="up"] { grid-column: 2; }
    .controls [data-dir="left"] { grid-column: 1; }
    .controls [data-dir="down"] { grid-column: 2; }
    .controls [data-dir="right"] { grid-column: 3; }
    .controls button { padding: 8px; touch-action: manipulation; }
  </style>
</head>
<body>
  <main class="shell">
    <header><h1>Snake</h1><p class="subtle">Eat the fruit. Avoid the walls and your tail. Use arrow keys, WASD, or the buttons.</p></header>
    <div class="bar"><span class="stat">Score: <strong id="score">0</strong></span><button class="button" id="toggle" type="button">Start</button><button class="button secondary" id="restart" type="button">New game</button></div>
    <p id="status" class="status" role="status" aria-live="polite">Press Start to play.</p>
    <div id="board" class="board" tabindex="0" role="group" aria-label="Snake board. Use arrow keys or WASD to turn."></div>
    <div class="controls" role="group" aria-label="Snake direction">
      <button class="button secondary" type="button" data-dir="up" aria-label="Turn up">↑</button>
      <button class="button secondary" type="button" data-dir="left" aria-label="Turn left">←</button>
      <button class="button secondary" type="button" data-dir="down" aria-label="Turn down">↓</button>
      <button class="button secondary" type="button" data-dir="right" aria-label="Turn right">→</button>
    </div>
  </main>
  <script>
    const size = 16;
    const vectors = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
    const board = document.getElementById('board');
    const status = document.getElementById('status');
    const scoreElement = document.getElementById('score');
    const toggleButton = document.getElementById('toggle');
    let snake, food, direction, queuedDirection, running, ended, timer, score;

    function placeFood() {
      const free = Array.from({ length: size * size }, (_, index) => index).filter((index) => !snake.includes(index));
      return free.length ? free[Math.floor(Math.random() * free.length)] : null;
    }

    function render() {
      board.replaceChildren();
      const body = new Set(snake);
      for (let index = 0; index < size * size; index++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (index === snake[0]) cell.classList.add('head');
        else if (body.has(index)) cell.classList.add('snake');
        else if (index === food) cell.classList.add('food');
        cell.setAttribute('aria-hidden', 'true');
        board.append(cell);
      }
      scoreElement.textContent = score;
      toggleButton.textContent = running ? 'Pause' : 'Start';
      toggleButton.disabled = ended;
    }

    function stop(message) {
      clearInterval(timer);
      timer = null;
      running = false;
      ended = true;
      status.textContent = message;
      render();
    }

    function step() {
      if (queuedDirection) direction = queuedDirection;
      queuedDirection = null;
      const [dx, dy] = vectors[direction];
      const x = snake[0] % size + dx;
      const y = Math.floor(snake[0] / size) + dy;
      if (x < 0 || x >= size || y < 0 || y >= size) return stop('Game over — you hit a wall.');
      const head = y * size + x;
      const grows = head === food;
      if (snake.slice(0, grows ? snake.length : -1).includes(head)) return stop('Game over — you hit your tail.');
      snake.unshift(head);
      if (grows) {
        score++;
        food = placeFood();
        if (food === null) return stop('You filled the board — you win!');
      } else snake.pop();
      render();
    }

    function turn(next) {
      if (!running || ended || !vectors[next] || queuedDirection || next === direction || next === opposites[direction]) return;
      queuedDirection = next;
    }

    function toggle() {
      if (ended) return;
      if (running) {
        clearInterval(timer);
        timer = null;
        running = false;
        status.textContent = 'Paused.';
      } else {
        running = true;
        timer = setInterval(step, 140);
        status.textContent = 'Collect the fruit!';
      }
      render();
      board.focus();
    }

    function newGame() {
      clearInterval(timer);
      timer = null;
      snake = [8 * size + 8, 8 * size + 7, 8 * size + 6];
      food = placeFood();
      direction = 'right';
      queuedDirection = null;
      running = false;
      ended = false;
      score = 0;
      status.textContent = 'Press Start to play.';
      render();
      board.focus();
    }

    toggleButton.addEventListener('click', toggle);
    document.getElementById('restart').addEventListener('click', newGame);
    document.querySelectorAll('[data-dir]').forEach((button) => button.addEventListener('click', () => turn(button.dataset.dir)));
    document.addEventListener('keydown', (event) => {
      const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (!keys[key]) return;
      event.preventDefault();
      turn(keys[key]);
    });
    newGame();
  </script>
</body>
</html>
