<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>Tic-Tac-Toe</title>
		<style>
			:root {
				font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				color: #f8fafc;
				background: #0f172a;
			}

			* { box-sizing: border-box; }

			body {
				min-height: 100dvh;
				margin: 0;
				background: radial-gradient(circle at 15% 0%, #312e81 0, transparent 45%), #0f172a;
			}

			button { font: inherit; }

			main {
				width: min(100%, 520px);
				min-height: 100dvh;
				margin: auto;
				padding: clamp(16px, 4vw, 28px);
				display: flex;
				flex-direction: column;
				justify-content: center;
			}

			header { margin-bottom: 20px; }

			.eyebrow {
				margin: 0 0 6px;
				color: #c4b5fd;
				font-size: 11px;
				font-weight: 800;
				letter-spacing: .16em;
			}

			h1 {
				margin: 0;
				font-size: clamp(24px, 5vw, 34px);
				line-height: 1.1;
			}

			header p:last-child {
				margin: 7px 0 0;
				color: #cbd5e1;
				font-size: 13px;
			}

			.game {
				border: 1px solid #334155;
				border-radius: 20px;
				background: #1e293b;
				padding: clamp(14px, 3vw, 20px);
				box-shadow: 0 18px 50px #02061755;
			}

			.mode-switch {
				display: flex;
				gap: 4px;
				margin-bottom: 12px;
				border: 1px solid #475569;
				border-radius: 10px;
				background: #0f172a;
				padding: 4px;
			}

			.mode-switch button {
				min-width: 0;
				flex: 1;
				border: 0;
				border-radius: 7px;
				background: transparent;
				padding: 7px 4px;
				color: #cbd5e1;
				font-size: 12px;
				font-weight: 700;
				cursor: pointer;
			}

			.mode-switch button[aria-pressed="true"] { background: #6d28d9; color: white; }
			.mode-switch button:not([aria-pressed="true"]):hover { background: #334155; }

			.toolbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
			}

			.turn {
				border: 1px solid #818cf8;
				border-radius: 999px;
				background: #312e81;
				padding: 7px 12px;
				color: #e0e7ff;
				font-size: 12px;
				font-weight: 800;
				white-space: nowrap;
			}

			.turn[data-player="O"] {
				border-color: #2dd4bf;
				background: #115e59;
				color: #ccfbf1;
			}

			.turn[data-player="done"] {
				border-color: #94a3b8;
				background: #334155;
				color: #f1f5f9;
			}

			.restart {
				min-height: 34px;
				border: 1px solid #64748b;
				border-radius: 8px;
				background: transparent;
				padding: 6px 11px;
				color: #f8fafc;
				font-size: 12px;
				font-weight: 700;
				cursor: pointer;
			}

			.restart:hover { background: #334155; }
			.restart:focus-visible, .cell:focus-visible, .mode-switch button:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }

			.status {
				min-height: 20px;
				margin: 13px 0 14px;
				color: #cbd5e1;
				font-size: 13px;
			}

			.board {
				width: min(100%, 320px);
				margin: auto;
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: clamp(5px, 1.4vw, 9px);
			}

			.cell {
				aspect-ratio: 1;
				border: 1px solid #475569;
				border-radius: 12px;
				background: #334155;
				color: #c7d2fe;
				font-size: clamp(32px, 9vw, 58px);
				font-weight: 800;
				line-height: 1;
				cursor: pointer;
				transition: background .15s ease, transform .15s ease;
			}

			.cell:not(:disabled):hover { background: #475569; transform: translateY(-2px); }
			.cell[data-mark="O"] { color: #5eead4; }
			.cell.winning { border-color: #a5b4fc; background: #4338ca; color: white; }
			.cell.winning[data-mark="O"] { border-color: #5eead4; background: #0f766e; }
			.cell:disabled { cursor: default; }

			.tip {
				margin: 15px 0 0;
				color: #94a3b8;
				font-size: 12px;
				text-align: center;
			}

			@media (min-width: 620px) {
				main { width: min(100%, 760px); padding: 16px 20px; }
				header { margin-bottom: 14px; }
				.game {
					display: grid;
					grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
					grid-template-rows: auto auto auto 1fr;
					column-gap: 20px;
					align-items: start;
					padding: 16px;
				}
				.mode-switch { grid-column: 1; grid-row: 1; }
				.toolbar { grid-column: 1; grid-row: 2; }
				.status { grid-column: 1; grid-row: 3; }
				.board {
					grid-column: 2;
					grid-row: 1 / 5;
					width: min(100%, 300px, max(190px, calc(100dvh - 165px)));
				}
				.tip { grid-column: 1; grid-row: 4; align-self: end; text-align: left; }
			}

			@media (max-width: 340px) {
				main { padding: 12px; }
				header { margin-bottom: 14px; }
				.game { padding: 12px; }
				.cell { border-radius: 8px; }
			}

			@media (max-width: 340px) and (max-height: 380px) {
				main { padding: 8px; }
				header, .tip { display: none; }
				.game { padding: 10px; }
				.mode-switch { margin-bottom: 8px; }
				.mode-switch button { padding: 5px 3px; font-size: 11px; }
				.status { margin: 8px 0; font-size: 12px; }
				.board { width: min(100%, 158px); }
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<p class="eyebrow">QUICK MATCH</p>
				<h1>Tic-Tac-Toe</h1>
				<p>Play together or challenge the AI.</p>
			</header>
			<section class="game" aria-label="Tic-Tac-Toe game">
				<div class="mode-switch" role="group" aria-label="Game mode">
					<button type="button" data-mode="local" aria-pressed="true">2 Players</button>
					<button type="button" data-mode="ai" aria-pressed="false">Vs AI</button>
				</div>
				<div class="toolbar">
					<span id="turn" class="turn" data-player="X">X's turn</span>
					<button id="restart" class="restart" type="button">New game</button>
				</div>
				<p id="status" class="status" role="status" aria-live="polite">Player X, make your move.</p>
				<div class="board" role="group" aria-label="Tic-Tac-Toe board">
					<button class="cell" type="button" data-cell="0" aria-label="Row 1, column 1, empty"></button>
					<button class="cell" type="button" data-cell="1" aria-label="Row 1, column 2, empty"></button>
					<button class="cell" type="button" data-cell="2" aria-label="Row 1, column 3, empty"></button>
					<button class="cell" type="button" data-cell="3" aria-label="Row 2, column 1, empty"></button>
					<button class="cell" type="button" data-cell="4" aria-label="Row 2, column 2, empty"></button>
					<button class="cell" type="button" data-cell="5" aria-label="Row 2, column 3, empty"></button>
					<button class="cell" type="button" data-cell="6" aria-label="Row 3, column 1, empty"></button>
					<button class="cell" type="button" data-cell="7" aria-label="Row 3, column 2, empty"></button>
					<button class="cell" type="button" data-cell="8" aria-label="Row 3, column 3, empty"></button>
				</div>
				<p class="tip">Get three in a row to win.</p>
			</section>
		</main>
		<script>
			const cells = [...document.querySelectorAll('[data-cell]')];
			const status = document.getElementById('status');
			const turn = document.getElementById('turn');
			const restart = document.getElementById('restart');
			const modeButtons = [...document.querySelectorAll('[data-mode]')];
			const winningLines = [
				[0, 1, 2], [3, 4, 5], [6, 7, 8],
				[0, 3, 6], [1, 4, 7], [2, 5, 8],
				[0, 4, 8], [2, 4, 6]
			];
			const preferredMoves = [4, 0, 2, 6, 8, 1, 3, 5, 7];
			const casualMoveChance = 0.45;

			let board = Array(9).fill(null);
			let currentPlayer = 'X';
			let winningLine = [];
			let gameOver = false;
			let mode = 'local';
			let aiTimer = null;

			function winnerFor(state) {
				const line = winningLines.find((candidate) => state[candidate[0]] && candidate.every((index) => state[index] === state[candidate[0]]));
				return line ? state[line[0]] : null;
			}

			function minimax(state, player, depth) {
				const winner = winnerFor(state);
				if (winner) return winner === 'O' ? 10 - depth : depth - 10;
				if (state.every(Boolean)) return 0;

				let bestScore = player === 'O' ? -Infinity : Infinity;
				for (const index of preferredMoves) {
					if (state[index]) continue;
					state[index] = player;
					const score = minimax(state, player === 'O' ? 'X' : 'O', depth + 1);
					state[index] = null;
					bestScore = player === 'O' ? Math.max(bestScore, score) : Math.min(bestScore, score);
				}
				return bestScore;
			}

			function chooseAiMove() {
				const choices = [];
				let bestScore = -Infinity;
				for (const index of preferredMoves) {
					if (board[index]) continue;
					board[index] = 'O';
					const winsNow = winnerFor(board) === 'O';
					const score = winsNow ? 10 : minimax(board, 'X', 1);
					board[index] = null;
					if (winsNow) return index;
					choices.push({ index, score });
					bestScore = Math.max(bestScore, score);
				}
				const weakerMoves = choices.filter((choice) => choice.score < bestScore);
				if (weakerMoves.length && Math.random() < casualMoveChance) {
					return weakerMoves[Math.floor(Math.random() * weakerMoves.length)].index;
				}
				return choices.find((choice) => choice.score === bestScore)?.index ?? null;
			}

			function render() {
				modeButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
				cells.forEach((cell, index) => {
					const mark = board[index];
					cell.textContent = mark ?? '';
					cell.dataset.mark = mark ?? '';
					cell.classList.toggle('winning', winningLine.includes(index));
					cell.disabled = Boolean(mark) || gameOver || (mode === 'ai' && currentPlayer === 'O');
					cell.setAttribute('aria-label', `Row ${Math.floor(index / 3) + 1}, column ${index % 3 + 1}, ${mark ?? 'empty'}`);
				});

				if (winningLine.length) {
					const winner = mode === 'ai' ? (currentPlayer === 'X' ? 'You win' : 'AI wins') : `Player ${currentPlayer} wins`;
					turn.textContent = winner;
					turn.dataset.player = 'done';
					status.textContent = `${winner}!`;
				} else if (gameOver) {
					turn.textContent = 'Draw';
					turn.dataset.player = 'done';
					status.textContent = "It's a draw!";
				} else if (mode === 'ai') {
					turn.textContent = currentPlayer === 'X' ? 'Your turn' : 'AI turn';
					turn.dataset.player = currentPlayer;
					status.textContent = currentPlayer === 'X' ? 'Place an X.' : 'AI is thinking…';
				} else {
					turn.textContent = `${currentPlayer}'s turn`;
					turn.dataset.player = currentPlayer;
					status.textContent = `Player ${currentPlayer}, make your move.`;
				}
			}

			function play(index, source = 'human') {
				if (gameOver || board[index]) return;
				if (source === 'ai' && (mode !== 'ai' || currentPlayer !== 'O')) return;
				if (source === 'human' && mode === 'ai' && currentPlayer !== 'X') return;
				board[index] = currentPlayer;
				winningLine = winningLines.find((line) => line.every((cell) => board[cell] === currentPlayer)) ?? [];

				if (winningLine.length || board.every(Boolean)) {
					gameOver = true;
				} else {
					currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
				}
				render();
				if (mode === 'ai' && source === 'human' && !gameOver && currentPlayer === 'O') {
					aiTimer = window.setTimeout(() => {
						aiTimer = null;
						if (mode !== 'ai' || gameOver || currentPlayer !== 'O') return;
						const nextMove = chooseAiMove();
						if (nextMove !== null) play(nextMove, 'ai');
					}, 350);
				}
			}

			cells.forEach((cell, index) => cell.addEventListener('click', () => play(index)));
			function resetGame() {
				if (aiTimer !== null) window.clearTimeout(aiTimer);
				aiTimer = null;
				board = Array(9).fill(null);
				currentPlayer = 'X';
				winningLine = [];
				gameOver = false;
				render();
			}

			restart.addEventListener('click', resetGame);
			modeButtons.forEach((button) => button.addEventListener('click', () => {
				if (button.dataset.mode !== 'local' && button.dataset.mode !== 'ai') return;
				if (mode === button.dataset.mode) return;
				mode = button.dataset.mode;
				resetGame();
			}));
			render();
		</script>
	</body>
</html>
