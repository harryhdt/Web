<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Trail</title>
  <link rel="stylesheet" href="/games/shared.css">
  <style>
    .shell { justify-content: flex-start; gap: 9px; padding: 10px; }
    .field { display: block; width: min(100%, 600px, calc((100dvh - 160px) * 1.5)); min-width: min(100%, 230px); height: auto; margin: 0 auto; border: 3px solid #475569; border-radius: 12px; background: #7dd3fc; touch-action: none; }
    .field:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
    .controls { position: sticky; bottom: 0; z-index: 1; display: flex; justify-content: center; gap: 12px; padding: 4px 0; background: #020617; }
    .controls button { width: min(25%, 90px); min-height: 52px; padding: 5px; font-size: 1.3rem; touch-action: none; user-select: none; }
    .controls #jump { margin-left: 20px; width: min(35%, 120px); font-size: 1rem; }
    @media (max-height: 340px) and (min-width: 500px) {
      .shell { width: 100%; max-width: none; min-height: 100dvh; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto auto; align-content: center; gap: 4px 8px; }
      header:not([hidden]) { grid-column: 1 / -1; }
      .bar { grid-column: 1; grid-row: 2; }
      .status { grid-column: 1; grid-row: 3; }
      .field { grid-column: 2; grid-row: 2 / 5; width: min(100%, calc((100dvh - 20px) * 1.5)); min-width: 0; }
      .controls { grid-column: 1; grid-row: 4; position: static; gap: 4px; }
      .controls button { min-height: 44px; }
      .controls #jump { margin-left: 4px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header><h1>Pixel Trail</h1><p class="subtle">Run, jump over gaps, collect stars, stomp critters, and reach the flag. Use ← → and Space / ↑, or the touch controls.</p></header>
    <div class="bar"><span class="stat">Stars: <strong id="stars">0</strong></span><span class="stat">Hearts: <strong id="hearts">♥ ♥ ♥</strong></span><button id="toggle" class="button" type="button">Start</button><button id="restart" class="button secondary" type="button">New game</button></div>
    <p id="status" class="status" role="status" aria-live="polite">Reach the flag at the end of the trail.</p>
    <canvas id="game" class="field" width="480" height="320" tabindex="0" aria-label="Platformer level. Move with left and right and jump with Space or Up Arrow."></canvas>
    <div class="controls" role="group" aria-label="Touch game controls">
      <button class="button secondary" type="button" data-hold="left" aria-label="Move left">←</button>
      <button class="button secondary" type="button" data-hold="right" aria-label="Move right">→</button>
      <button class="button" id="jump" type="button" aria-label="Jump">Jump ↑</button>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const instructions = document.querySelector('header');
    const status = document.getElementById('status');
    const starsElement = document.getElementById('stars');
    const heartsElement = document.getElementById('hearts');
    const toggle = document.getElementById('toggle');
    const width = 480;
    const height = 320;
    const end = 2350;
    const groundY = 280;
    const ground = [[0, 600], [680, 1230], [1310, 1840], [1920, end]];
    const platforms = [
      { x: 155, y: 210, w: 95 }, { x: 455, y: 210, w: 95 },
      { x: 720, y: 220, w: 100 }, { x: 1010, y: 200, w: 105 },
      { x: 1340, y: 220, w: 100 }, { x: 1690, y: 200, w: 105 },
      { x: 1890, y: 225, w: 100 }, { x: 2110, y: 205, w: 110 }
    ];
    const surfaces = [
      ...ground.map(([start, stop]) => ({ x: start, y: groundY, w: stop - start })),
      ...platforms
    ];
    const starPositions = [
      [105, 247], [200, 174], [335, 247], [500, 174], [735, 185],
      [875, 245], [1058, 164], [1180, 245], [1385, 185], [1550, 245],
      [1740, 164], [1950, 189], [2160, 169], [2260, 245]
    ];
    const enemyPositions = [
      [370, 300, 555], [850, 795, 950], [1140, 1100, 1200],
      [1490, 1440, 1620], [2040, 1980, 2140]
    ];
    const held = { left: false, right: false };
    let player, enemies, stars, hearts, collected, checkpoint, camera, state, frame, lastTime, jumpBuffer, coyote;

    function fit() {
      const scale = Math.min(window.devicePixelRatio || 1, 3);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
      draw();
    }

    function hud() {
      starsElement.textContent = collected;
      heartsElement.textContent = '♥ '.repeat(hearts).trim() || '—';
      toggle.textContent = state === 'running' ? 'Pause' : state === 'paused' ? 'Resume' : 'Start';
      toggle.disabled = state === 'won' || state === 'lost';
      instructions.hidden = state !== 'ready';
    }

    function roundRect(x, y, w, h, color, r = 5) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function draw() {
      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, '#38bdf8');
      sky.addColorStop(1, '#dbeafe');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = '#a7f3d0';
      for (let x = -120 - (camera * .2 % 230); x < width + 230; x += 230) {
        ctx.beginPath();
        ctx.arc(x + 90, 295, 100, Math.PI, 0);
        ctx.fill();
      }

      ctx.save();
      ctx.translate(-Math.round(camera), 0);
      for (const [start, stop] of ground) {
        ctx.fillStyle = '#854d0e';
        ctx.fillRect(start, groundY, stop - start, height - groundY);
        ctx.fillStyle = '#4ade80';
        ctx.fillRect(start, groundY, stop - start, 9);
        for (let x = start + 12; x < stop; x += 32) {
          ctx.fillStyle = '#a16207';
          ctx.fillRect(x, groundY + 20, 7, 6);
        }
      }
      for (const platform of platforms) {
        roundRect(platform.x, platform.y, platform.w, 12, '#a16207', 3);
        ctx.fillStyle = '#4ade80';
        ctx.fillRect(platform.x, platform.y, platform.w, 5);
      }

      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(1190, 210, 4, 70);
      ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.moveTo(1194, 210); ctx.lineTo(1230, 224); ctx.lineTo(1194, 238); ctx.fill();
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(2290, 171, 5, 109);
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath(); ctx.moveTo(2295, 171); ctx.lineTo(2334, 188); ctx.lineTo(2295, 206); ctx.fill();

      for (const star of stars) {
        if (star.taken) continue;
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const angle = i * Math.PI / 5 - Math.PI / 2;
          const radius = i % 2 ? 5 : 11;
          const x = star.x + Math.cos(angle) * radius;
          const y = star.y + Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.fill();
      }

      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        roundRect(enemy.x - 12, groundY - 20, 24, 20, '#b45309', 7);
        ctx.fillStyle = '#fff';
        ctx.fillRect(enemy.x - 7, groundY - 13, 5, 5);
        ctx.fillRect(enemy.x + 3, groundY - 13, 5, 5);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(enemy.x - 5, groundY - 11, 2, 2);
        ctx.fillRect(enemy.x + 5, groundY - 11, 2, 2);
      }

      if (player.invulnerable <= 0 || Math.floor(player.invulnerable * 12) % 2 === 0) {
        roundRect(player.x, player.y, player.w, player.h, '#6d28d9', 5);
        roundRect(player.x - 3, player.y + 10, 7, 16, '#f97316', 2);
        roundRect(player.x + 3, player.y - 5, 20, 9, '#4c1d95', 4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(player.x + (player.facing > 0 ? 15 : 5), player.y + 8, 4, 4);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(player.x + (player.facing > 0 ? 17 : 5), player.y + 9, 2, 2);
      }
      ctx.restore();

      if (state !== 'running') {
        ctx.fillStyle = 'rgba(15, 23, 42, .6)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 23px system-ui';
        ctx.fillText(state === 'won' ? 'Trail complete!' : state === 'lost' ? 'Try again!' : state === 'paused' ? 'Paused' : 'Ready to explore?', width / 2, 130);
      }
    }

    function pause(message) {
      if (state !== 'running') return;
      state = 'paused';
      cancelAnimationFrame(frame);
      frame = null;
      lastTime = null;
      held.left = held.right = false;
      status.textContent = message;
      hud();
      draw();
    }

    function finish(result, message) {
      state = result;
      frame = null;
      held.left = held.right = false;
      status.textContent = message;
      hud();
      draw();
    }

    function hurt(fell = false) {
      if (!fell && player.invulnerable > 0) return;
      hearts--;
      if (hearts <= 0) return finish('lost', 'No hearts left. Start a new adventure!');
      player.x = checkpoint;
      player.y = groundY - player.h;
      player.vy = 0;
      player.invulnerable = 1.5;
      camera = Math.max(0, Math.min(end - width, checkpoint - 130));
      status.textContent = 'Ouch! Back to the checkpoint.';
      hud();
    }

    function update(dt) {
      const previousBottom = player.y + player.h;
      const direction = Number(held.right) - Number(held.left);
      if (direction) player.facing = direction;
      player.x = Math.max(0, Math.min(end - player.w, player.x + direction * 230 * dt));
      if (player.grounded) coyote = .11;
      else coyote = Math.max(0, coyote - dt);
      jumpBuffer = Math.max(0, jumpBuffer - dt);
      if (jumpBuffer > 0 && coyote > 0) {
        player.vy = -525;
        player.grounded = false;
        coyote = 0;
        jumpBuffer = 0;
      }
      player.vy = Math.min(720, player.vy + 1450 * dt);
      player.y += player.vy * dt;
      player.grounded = false;
      if (player.vy >= 0) {
        for (const surface of surfaces) {
          if (previousBottom <= surface.y + 2 && player.y + player.h >= surface.y &&
              player.x + player.w > surface.x && player.x < surface.x + surface.w) {
            player.y = surface.y - player.h;
            player.vy = 0;
            player.grounded = true;
            break;
          }
        }
      }
      if (player.y > height + 40) { hurt(true); if (state !== 'running') return; }
      player.invulnerable = Math.max(0, player.invulnerable - dt);

      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        enemy.x += enemy.speed * dt;
        if (enemy.x < enemy.min || enemy.x > enemy.max) {
          enemy.x = Math.max(enemy.min, Math.min(enemy.max, enemy.x));
          enemy.speed *= -1;
        }
        if (player.x + player.w < enemy.x - 11 || player.x > enemy.x + 11 ||
            player.y + player.h < groundY - 20 || player.y > groundY) continue;
        if (player.vy > 0 && previousBottom <= groundY - 13) {
          enemy.alive = false;
          player.vy = -340;
          status.textContent = 'Critter stomped!';
        } else { hurt(); if (state !== 'running') return; }
      }
      for (const star of stars) {
        if (!star.taken && Math.abs(player.x + player.w / 2 - star.x) < 18 &&
            Math.abs(player.y + player.h / 2 - star.y) < 22) {
          star.taken = true;
          collected++;
          hud();
        }
      }
      if (checkpoint === 35 && player.x > 1200) {
        checkpoint = 1000;
        status.textContent = 'Checkpoint reached!';
      }
      if (player.x + player.w >= 2290) return finish('won', `Trail complete! You found ${collected} of ${stars.length} stars.`);
      camera += (Math.max(0, Math.min(end - width, player.x - 125)) - camera) * Math.min(1, dt * 10);
    }

    function tick(timestamp) {
      if (state !== 'running') return;
      const dt = lastTime === null ? 0 : Math.min((timestamp - lastTime) / 1000, .033);
      lastTime = timestamp;
      update(dt);
      if (state !== 'running') return;
      draw();
      frame = requestAnimationFrame(tick);
    }

    function start() {
      if (state !== 'ready' && state !== 'paused') return;
      state = 'running';
      lastTime = null;
      status.textContent = 'Find the flag!';
      hud();
      canvas.focus({ preventScroll: true });
      frame = requestAnimationFrame(tick);
    }

    function jump() {
      if (state === 'ready') start();
      if (state === 'running') jumpBuffer = .14;
    }

    function reset() {
      cancelAnimationFrame(frame);
      frame = null;
      lastTime = null;
      held.left = held.right = false;
      player = { x: 35, y: groundY - 30, w: 24, h: 30, vy: 0, grounded: true, facing: 1, invulnerable: 0 };
      enemies = enemyPositions.map(([x, min, max]) => ({ x, min, max, speed: 44, alive: true }));
      stars = starPositions.map(([x, y]) => ({ x, y, taken: false }));
      hearts = 3;
      collected = 0;
      checkpoint = 35;
      camera = 0;
      jumpBuffer = 0;
      coyote = 0;
      state = 'ready';
      status.textContent = 'Reach the flag at the end of the trail.';
      hud();
      draw();
    }

    toggle.addEventListener('click', () => state === 'running' ? pause('Paused. Press Resume to continue.') : start());
    document.getElementById('restart').addEventListener('click', reset);
    document.addEventListener('keydown', (event) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space', 'KeyA', 'KeyD', 'KeyW'].includes(event.code)) {
        if (event.code === 'Space' && event.target instanceof HTMLButtonElement) return;
        event.preventDefault();
      }
      if (event.code === 'ArrowLeft' || event.code === 'KeyA') held.left = true;
      if (event.code === 'ArrowRight' || event.code === 'KeyD') held.right = true;
      if (['ArrowUp', 'Space', 'KeyW'].includes(event.code) && !event.repeat) jump();
    });
    document.addEventListener('keyup', (event) => {
      if (event.code === 'ArrowLeft' || event.code === 'KeyA') held.left = false;
      if (event.code === 'ArrowRight' || event.code === 'KeyD') held.right = false;
    });
    for (const button of document.querySelectorAll('[data-hold]')) {
      const direction = button.dataset.hold;
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        if (state === 'ready') start();
        held[direction] = true;
      });
      const release = () => { held[direction] = false; };
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', release);
    }
    const jumpButton = document.getElementById('jump');
    jumpButton.addEventListener('pointerdown', (event) => { event.preventDefault(); jump(); });
    jumpButton.addEventListener('click', (event) => { if (event.detail === 0) jump(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) pause('Paused while hidden.'); });
    window.addEventListener('blur', () => pause('Paused while inactive.'));
    window.addEventListener('resize', fit);
    reset();
    fit();
  </script>
</body>
</html>
