<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="/games/shared.css">
  <style>
    .shell { justify-content: flex-start; }
    .playfield { display: block; width: min(100%, 360px, calc((100dvh - 190px) * .783)); min-width: min(100%, 180px); height: auto; margin: auto; border: 3px solid #475569; border-radius: 14px; background: #7dd3fc; touch-action: manipulation; cursor: pointer; }
    .playfield:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
    #flap { width: min(100%, 360px); margin: 0 auto; }
  </style>
</head>
<body>
  <main class="shell">
    <header><h1>Flappy Bird</h1><p class="subtle">Fly through the gaps. Press Space or ↑, tap the game, or use Flap. Avoid the pipes and ground.</p></header>
    <div class="bar"><span class="stat">Score: <strong id="score">0</strong></span><span class="stat">Best: <strong id="best">0</strong></span><button class="button" id="toggle" type="button">Start</button><button class="button secondary" id="restart" type="button">New game</button></div>
    <p id="status" class="status" role="status" aria-live="polite">Press Start to play.</p>
    <canvas id="game" class="playfield" width="360" height="460" tabindex="0" aria-label="Flappy Bird playfield. Press Space or Up Arrow to flap."></canvas>
    <button class="button secondary" id="flap" type="button">Flap ↑</button>
  </main>
  <script>
    const canvas = document.getElementById('game');
    const context = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const bestElement = document.getElementById('best');
    const statusElement = document.getElementById('status');
    const toggleButton = document.getElementById('toggle');
    const instructions = document.querySelector('header');
    const width = 360;
    const height = 460;
    const ground = 424;
    const birdX = 88;
    const radius = 12;
    const pipeWidth = 56;
    const gapHeight = 145;
    const speed = 145;
    let birdY, velocity, pipes, spawnTime, score, best = 0, state, frameId, lastTime;

    function resizeCanvas() {
      const scale = Math.min(window.devicePixelRatio || 1, 3);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      context.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
      draw();
    }

    function draw() {
      const sky = context.createLinearGradient(0, 0, 0, ground);
      sky.addColorStop(0, '#38bdf8');
      sky.addColorStop(1, '#bae6fd');
      context.fillStyle = sky;
      context.fillRect(0, 0, width, ground);

      for (const pipe of pipes) {
        const top = pipe.center - gapHeight / 2;
        const bottom = pipe.center + gapHeight / 2;
        context.fillStyle = '#15803d';
        context.fillRect(pipe.x, 0, pipeWidth, top);
        context.fillRect(pipe.x, bottom, pipeWidth, ground - bottom);
        context.fillStyle = '#22c55e';
        context.fillRect(pipe.x - 4, top - 20, pipeWidth + 8, 20);
        context.fillRect(pipe.x - 4, bottom, pipeWidth + 8, 20);
      }

      context.fillStyle = '#a16207';
      context.fillRect(0, ground, width, height - ground);
      context.fillStyle = '#84cc16';
      context.fillRect(0, ground, width, 7);

      context.fillStyle = '#facc15';
      context.beginPath();
      context.arc(birdX, birdY, radius, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = '#f97316';
      context.beginPath();
      context.moveTo(birdX + 9, birdY);
      context.lineTo(birdX + 20, birdY + 4);
      context.lineTo(birdX + 9, birdY + 8);
      context.fill();
      context.fillStyle = '#0f172a';
      context.beginPath();
      context.arc(birdX + 4, birdY - 5, 2, 0, Math.PI * 2);
      context.fill();

      if (state !== 'running') {
        context.fillStyle = 'rgba(15, 23, 42, .65)';
        context.fillRect(0, 0, width, ground);
        context.fillStyle = '#fff';
        context.textAlign = 'center';
        context.font = 'bold 26px system-ui';
        context.fillText(state === 'ended' ? 'Game over!' : state === 'paused' ? 'Paused' : 'Ready to fly?', width / 2, ground / 2 - 55);
      }
    }

    function updateControls() {
      instructions.hidden = state !== 'ready';
      toggleButton.textContent = state === 'running' ? 'Pause' : state === 'paused' ? 'Resume' : 'Start';
      toggleButton.disabled = state === 'ended';
      scoreElement.textContent = score;
      bestElement.textContent = best;
    }

    function pause(message) {
      if (state !== 'running') return;
      state = 'paused';
      cancelAnimationFrame(frameId);
      frameId = null;
      lastTime = null;
      statusElement.textContent = message;
      updateControls();
      draw();
    }

    function endGame() {
      state = 'ended';
      frameId = null;
      statusElement.textContent = `Game over — you scored ${score}. Start a new game!`;
      updateControls();
      draw();
    }

    function step(timestamp) {
      if (state !== 'running') return;
      const dt = lastTime === null ? 0 : Math.min((timestamp - lastTime) / 1000, .033);
      lastTime = timestamp;
      velocity += 1050 * dt;
      birdY += velocity * dt;

      spawnTime += dt;
      if (spawnTime >= 1.55) {
        spawnTime -= 1.55;
        pipes.push({ x: width + 10, center: 150 + Math.random() * 140, scored: false });
      }
      for (const pipe of pipes) {
        pipe.x -= speed * dt;
        if (!pipe.scored && pipe.x + pipeWidth < birdX) {
          pipe.scored = true;
          score++;
          best = Math.max(best, score);
          statusElement.textContent = `Through ${score} ${score === 1 ? 'pipe' : 'pipes'}!`;
          updateControls();
        }
        if (birdX + radius > pipe.x && birdX - radius < pipe.x + pipeWidth &&
            (birdY - radius < pipe.center - gapHeight / 2 || birdY + radius > pipe.center + gapHeight / 2)) {
          endGame();
          return;
        }
      }
      pipes = pipes.filter((pipe) => pipe.x + pipeWidth > 0);
      if (birdY - radius < 0 || birdY + radius >= ground) {
        endGame();
        return;
      }
      draw();
      frameId = requestAnimationFrame(step);
    }

    function start() {
      if (state === 'ended' || state === 'running') return;
      state = 'running';
      lastTime = null;
      statusElement.textContent = 'Keep flapping!';
      updateControls();
      canvas.focus({ preventScroll: true });
      frameId = requestAnimationFrame(step);
    }

    function flap() {
      if (state === 'ended') return;
      if (state !== 'running') start();
      velocity = -335;
    }

    function newGame() {
      cancelAnimationFrame(frameId);
      frameId = null;
      lastTime = null;
      birdY = ground / 2;
      velocity = 0;
      pipes = [];
      spawnTime = 1;
      score = 0;
      state = 'ready';
      statusElement.textContent = 'Press Start to play.';
      updateControls();
      draw();
      canvas.focus({ preventScroll: true });
    }

    toggleButton.addEventListener('click', () => state === 'running' ? pause('Paused. Press Resume to continue.') : start());
    document.getElementById('restart').addEventListener('click', newGame);
    document.getElementById('flap').addEventListener('click', flap);
    canvas.addEventListener('pointerdown', flap);
    document.addEventListener('keydown', (event) => {
      if (event.target instanceof HTMLButtonElement || !['Space', 'ArrowUp'].includes(event.code)) return;
      event.preventDefault();
      if (!event.repeat) flap();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pause('Paused while the game was hidden.');
    });
    window.addEventListener('resize', resizeCanvas);
    newGame();
    resizeCanvas();
  </script>
</body>
</html>
