<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Timer</title><link rel="stylesheet" href="/tools/shared.css"></head>
<body>
  <main class="shell">
    <header><h1>Timer</h1><p class="subtle">Pause and resume a countdown.</p></header>
    <div class="panel fields">
      <label class="field">Minutes (0–999)<input id="minutes" type="text" inputmode="numeric" value="5"></label>
      <label class="field">Seconds (0–59)<input id="seconds" type="text" inputmode="numeric" value="0"></label>
    </div>
    <div class="result" role="timer" aria-live="off"><p class="result-label" id="label">Time remaining</p><strong class="result-value mono" id="clock">05:00</strong><p class="result-note error" id="error" hidden>Enter up to 999 minutes and 0–59 seconds.</p></div>
    <div class="controls"><button class="button" id="start" type="button">Start</button><button class="button secondary" id="reset" type="button">Reset</button></div>
  </main>
  <script>
    const minutes = document.getElementById('minutes');
    const seconds = document.getElementById('seconds');
    const clock = document.getElementById('clock');
    const label = document.getElementById('label');
    const startButton = document.getElementById('start');
    let remainingMs = 0;
    let endTime = 0;
    let running = false;
    let started = false;
    let interval = null;
    function duration() {
      if (!/^\d{1,3}$/.test(minutes.value) || !/^\d{1,2}$/.test(seconds.value) || Number(seconds.value) > 59) return null;
      return (Number(minutes.value) * 60 + Number(seconds.value)) * 1000;
    }
    function render() {
      const value = duration();
      const displayed = Math.ceil((started ? remainingMs : value ?? 0) / 1000);
      clock.textContent = `${String(Math.floor(displayed / 60)).padStart(2, '0')}:${String(displayed % 60).padStart(2, '0')}`;
      label.textContent = started && !running && remainingMs === 0 ? 'Time is up' : running ? 'Counting down' : 'Time remaining';
      minutes.disabled = seconds.disabled = started;
      minutes.setAttribute('aria-invalid', String(value === null));
      seconds.setAttribute('aria-invalid', String(value === null));
      document.getElementById('error').hidden = value !== null || started;
      startButton.textContent = running ? 'Pause' : started ? 'Resume' : 'Start';
      startButton.disabled = !running && (started ? remainingMs <= 0 : value === null || value === 0);
    }
    startButton.addEventListener('click', () => {
      if (running) {
        remainingMs = Math.max(0, endTime - performance.now());
        running = false;
        clearInterval(interval);
      } else {
        const timeLeft = started ? remainingMs : duration();
        if (timeLeft === null || timeLeft <= 0) return;
        remainingMs = timeLeft;
        started = running = true;
        endTime = performance.now() + remainingMs;
        interval = setInterval(() => {
          remainingMs = Math.max(0, endTime - performance.now());
          if (remainingMs === 0) { running = false; clearInterval(interval); }
          render();
        }, 100);
      }
      render();
    });
    document.getElementById('reset').addEventListener('click', () => {
      clearInterval(interval); running = started = false; remainingMs = 0; render();
    });
    [minutes, seconds].forEach((input) => input.addEventListener('input', render));
    render();
  </script>
</body>
</html>
