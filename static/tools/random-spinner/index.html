<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Random Spinner</title><link rel="stylesheet" href="/tools/shared.css">
  <style>
    .wheel-wrap { position: relative; width: min(224px, 100%); aspect-ratio: 1; margin: auto; }
    .wheel { width: 100%; height: 100%; border: 4px solid white; border-radius: 50%; box-shadow: 0 4px 12px #0003; }
    .pointer { position: absolute; z-index: 1; top: 0; left: 50%; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 18px solid #171717; transform: translateX(-50%); }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
    .choices li { max-width: 100%; overflow-wrap: anywhere; border: 1px solid #e5e5e5; border-radius: 100px; background: white; padding: 5px 12px; }
  </style>
</head>
<body>
  <main class="shell">
    <header><h1>Random Spinner</h1><p class="subtle">Spin a wheel of custom choices.</p></header>
    <label class="field panel">Choices (one per line or separated by commas)<textarea id="input" rows="4">Coffee&#10;Tea&#10;Water&#10;Juice</textarea></label>
    <p class="error" id="error" hidden>Enter 2 to 24 choices to spin.</p>
    <div class="wheel-wrap" aria-hidden="true"><div class="pointer"></div><div class="wheel" id="wheel"></div></div>
    <ol class="choices" id="choices" aria-label="Spinner choices"></ol>
    <button class="button" id="spin" type="button">Spin</button>
    <div class="result" role="status" aria-live="polite"><p class="result-label">Selected choice</p><strong class="result-value" id="winner">—</strong></div>
  </main>
  <script type="module">
    import { randomInteger } from '/tools/shared.js';
    const colors = ['#0284c7', '#7c3aed', '#ea580c', '#059669', '#be123c', '#4f46e5'];
    const input = document.getElementById('input');
    const wheel = document.getElementById('wheel');
    const spinButton = document.getElementById('spin');
    const winner = document.getElementById('winner');
    let rotation = 0;
    let spinning = false;
    function entries() { return input.value.split(/[\n,]+/).map((item) => item.trim()).filter(Boolean); }
    function render() {
      const items = entries();
      const valid = items.length >= 2 && items.length <= 24;
      document.getElementById('error').hidden = valid;
      spinButton.disabled = spinning || !valid;
      document.getElementById('choices').replaceChildren(...(valid ? items.map((item, index) => {
        const li = document.createElement('li');
        li.textContent = `${index + 1}. ${item}`;
        return li;
      }) : []));
      wheel.style.background = valid ? `conic-gradient(${items.map((_, index) => `${colors[index % colors.length]} ${index / items.length * 100}% ${(index + 1) / items.length * 100}%`).join(', ')})` : '#d4d4d4';
    }
    input.addEventListener('input', () => { winner.textContent = '—'; render(); });
    spinButton.addEventListener('click', () => {
      const items = entries();
      if (spinning || items.length < 2 || items.length > 24) return;
      const picked = randomInteger(0, items.length - 1);
      const targetAngle = (360 - (picked + .5) * 360 / items.length) % 360;
      rotation += 1800 + (targetAngle - rotation % 360 + 360) % 360;
      spinning = true;
      winner.textContent = '—';
      input.disabled = true;
      spinButton.textContent = 'Spinning…';
      wheel.style.transition = 'transform 1800ms cubic-bezier(0.12, 0.75, 0.12, 1)';
      wheel.style.transform = `rotate(${rotation}deg)`;
      render();
      setTimeout(() => {
        winner.textContent = items[picked];
        spinning = false;
        input.disabled = false;
        spinButton.textContent = 'Spin';
        render();
      }, 1800);
    });
    render();
  </script>
</body>
</html>
